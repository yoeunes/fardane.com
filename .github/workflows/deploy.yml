name: Build and Deploy

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v3
                with:
                    node-version: '23.10'
                    cache: 'npm'

            -   name: Install dependencies
                run: npm ci
                env:
                    FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

            -   name: Build frontend assets with Vite
                run: npm run build

            -   name: Setup Ruby
                uses: ruby/setup-ruby@v1
                with:
                    ruby-version: '3.2'
                    bundler-cache: true

            -   name: Install Jekyll
                run: gem install jekyll bundler

            -   name: Build with Jekyll
                run: JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
                env:
                    JEKYLL_ENV: production

            -   name: Copy Vite assets to _site
                run: |
                    mkdir -p _site/assets/dist
                    cp -R assets/dist/* _site/assets/dist/

            -   name: List final site output
                run: find _site -type f | grep -v "/.git/" | sort

            -   name: Upload artifact
                uses: actions/upload-pages-artifact@v3
                with:
                    path: '_site/'

    deploy:
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            -   name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@v4
