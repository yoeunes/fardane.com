{% comment %}
  Callout / highlight box for Markdown articles.
  Usage:  {% include components/callout.html title="ملخص" content="النص هنا" %}
{% endcomment %}
<div class="not-prose bg-gradient-to-br from-amber-50/80 to-amber-100/80 backdrop-blur-sm rounded-2xl p-6 sm:p-8 border-r-4 border-amber-500 mb-10 shadow-sm relative overflow-hidden">
  <div class="absolute -right-20 -top-20 w-40 h-40 bg-amber-200/20 rounded-full"></div>
  <div class="relative flex items-start z-10">
    <div class="flex-shrink-0 ml-4">
      <div class="h-8 w-8 rounded-full bg-amber-100 flex items-center justify-center shadow-sm">
        <svg class="h-5 w-5 text-amber-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>
    <div>
      {% if include.title %}<h2 class="text-xl font-medium text-amber-800 mb-3 pb-2 border-b border-amber-200/50">{{ include.title }}</h2>{% endif %}
      <p class="text-stone-700 leading-relaxed">{{ include.content }}</p>
    </div>
  </div>
</div>
