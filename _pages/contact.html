<div class="container mx-auto px-4 py-8">
  <div class="flex items-center justify-center mb-8">
    <div class="h-px w-12 bg-amber-500"></div>
    <h1 class="text-3xl font-bold text-amber-900 px-4">تواصل معي</h1>
    <div class="h-px w-12 bg-amber-500"></div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
    <div class="bg-white rounded-xl shadow-sm p-8 text-center">
      <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 mx-auto mb-4">
        <i class="fas fa-envelope text-2xl"></i>
      </div>
      <h2 class="text-xl font-bold text-amber-800 mb-2">البريد الإلكتروني</h2>
      <p class="text-stone-700">contact@fardane.com</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-8 text-center">
      <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 mx-auto mb-4">
        <i class="fas fa-map-marker-alt text-2xl"></i>
      </div>
      <h2 class="text-xl font-bold text-amber-800 mb-2">العنوان</h2>
      <p class="text-stone-700">كلية الآداب والعلوم الإنسانية، جامعة القاضي عياض، مراكش، المغرب</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-8 text-center">
      <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 mx-auto mb-4">
        <i class="fas fa-clock text-2xl"></i>
      </div>
      <h2 class="text-xl font-bold text-amber-800 mb-2">أوقات التواصل</h2>
      <p class="text-stone-700">الإثنين - الجمعة: 9:00 صباحاً - 4:00 مساءً</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-8 mb-16">
    <h2 class="text-2xl font-bold text-amber-800 mb-6 text-center">أرسل لي رسالة</h2>

    <form class="max-w-2xl mx-auto space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="name" class="block text-stone-700 mb-1">الاسم</label>
          <input type="text" id="name" class="w-full px-4 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div>
          <label for="email" class="block text-stone-700 mb-1">البريد الإلكتروني</label>
          <input type="email" id="email" class="w-full px-4 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>
      </div>

      <div>
        <label for="subject" class="block text-stone-700 mb-1">الموضوع</label>
        <input type="text" id="subject" class="w-full px-4 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>

      <div>
        <label for="message" class="block text-stone-700 mb-1">الرسالة</label>
        <textarea id="message" rows="6" class="w-full px-4 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="bg-amber-700 text-white px-6 py-3 rounded-md hover:bg-amber-800 transition-colors">
          إرسال الرسالة
        </button>
      </div>
    </form>
  </div>

  <div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <div class="aspect-w-16 aspect-h-9 h-96">
      <!-- هنا يمكن وضع خريطة جوجل لموقع الجامعة -->
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3398.9721145442143!2d-8.013118384858251!3d31.6342347813309!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xdafee9eb5090999%3A0x2dca05cb5f1e42dd!2sFaculty%20of%20Arts%20and%20Humanities!5e0!3m2!1sen!2sma!4v1652345678123!5m2!1sen!2sma" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</div>
