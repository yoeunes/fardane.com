<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for highlights -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C975" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.7" />
    </linearGradient>
    
    <!-- Blue gradient for water elements -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Main corner framework - more elegant curves -->
  <path d="M5,145 Q5,50 145,5 L145,25 Q25,25 25,145 Z" 
        fill="#FAFEFF" 
        stroke="url(#blueGradient)" 
        stroke-width="0.8" />
  
  <!-- Inner ornamental border with improved detail -->
  <path d="M15,135 Q15,60 135,15 L135,30 Q30,30 30,135 Z" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="0.6" 
        stroke-dasharray="2,1" />
  
  <!-- Intricate geometric pattern -->
  <g transform="translate(25, 25)">
    <!-- Eight-pointed star - classic Islamic geometry -->
    <path d="M0,0 L20,5 L25,25 L5,20 Z M30,0 L50,5 L55,25 L35,20 Z M0,30 L20,35 L25,55 L5,50 Z M30,30 L50,35 L55,55 L35,50 Z" 
          fill="none" 
          stroke="#1E88E5" 
          stroke-width="0.5" 
          opacity="0.6" />
    
    <!-- Connecting geometric elements -->
    <path d="M25,0 L30,0 M25,55 L30,55 M0,25 L0,30 M55,25 L55,30" 
          stroke="#1E88E5" 
          stroke-width="0.5" 
          opacity="0.6" />
    
    <path d="M10,10 Q27.5,27.5 45,45" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="0.7" 
          opacity="0.7" />
  </g>
  
  <!-- Arabesque curves with improved flow -->
  <path d="M8,100 Q25,80 50,75 Q75,70 85,50 Q95,30 120,25" 
        fill="none" 
        stroke="#1E88E5" 
        stroke-width="0.8" 
        opacity="0.7" />
  
  <path d="M100,8 Q80,25 75,50 Q70,75 50,85 Q30,95 25,120" 
        fill="none" 
        stroke="#1E88E5" 
        stroke-width="0.8" 
        opacity="0.7" />
  
  <!-- Water droplet motifs -->
  <g fill="url(#blueGradient)" opacity="0.6">
    <path d="M40,40 C45,35 50,40 45,45 C40,50 35,45 40,40 Z" />
    <path d="M70,20 C73,17 76,20 73,23 C70,26 67,23 70,20 Z" />
    <path d="M20,70 C23,67 26,70 23,73 C20,76 17,73 20,70 Z" />
    <path d="M95,60 C97,58 99,60 97,62 C95,64 93,62 95,60 Z" />
    <path d="M60,95 C62,93 64,95 62,97 C60,99 58,97 60,95 Z" />
  </g>
  
  <!-- Decorative dots -->
  <g fill="#D4AF37" opacity="0.8">
    <circle cx="10" cy="130" r="1" />
    <circle cx="15" cy="125" r="0.8" />
    <circle cx="20" cy="120" r="0.6" />
    <circle cx="130" cy="10" r="1" />
    <circle cx="125" cy="15" r="0.8" />
    <circle cx="120" cy="20" r="0.6" />
  </g>
  
  <!-- Decorative calligraphic swirls -->
  <path d="M40,110 Q50,105 55,95 Q60,85 70,80" 
        fill="none" 
        stroke="#D4AF37" 
        stroke-width="0.7" 
        opacity="0.7" />
  
  <path d="M110,40 Q105,50 95,55 Q85,60 80,70" 
        fill="none" 
        stroke="#D4AF37" 
        stroke-width="0.7" 
        opacity="0.7" />
</svg>
