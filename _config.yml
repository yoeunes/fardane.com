title: "الدكتور فردان"
tagline: "باحث في تاريخ المياه - جامعة القاضي عياض، مراكش"
description: >-
    موقع الدكتور فردان المتخصص في تاريخ المياه والدراسات التاريخية 
        في المغرب وشمال أفريقيا. أستاذ بجامعة القاضي عياض في مراكش.

timezone: "Africa/Casablanca"
lang: "ar"
direction: "rtl"

baseurl: ""
url: "https://fardane.com"

# Build settings
incremental: true
profile: true
ignore_theme_config: true
theme: minima

plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-sitemap

include:
    - _pages

# Exclude Development Files
exclude:
    - bin
    - config
    - vite.config.ts
    - tmp
    - .sass-cache/
    - .jekyll-cache/
    - gemfiles/
    - Gemfile
    - Gemfile.lock
    - node_modules/
    - vendor/
    - package.json
    - package-lock.json
    - vite.config.js
    - tailwind.config.js
    - postcss.config.js
    - README.md
    - .gitignore
    - .vite/

# Default Front Matter
defaults:
    -   scope:
            path: ""
        values:
            layout: "default"
            lang: "ar"
            direction: "rtl"
