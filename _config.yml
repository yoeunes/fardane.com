url: https://fardane.com

title: "الدكتور فردان"
tagline: "باحث في تاريخ المياه - جامعة القاضي عياض، مراكش"
description: >-
    موقع الدكتور فردان المتخصص في تاريخ المياه والدراسات التاريخية 
        في المغرب وشمال أفريقيا. أستاذ بجامعة القاضي عياض في مراكش.

timezone: "Africa/Casablanca"
lang: "ar"
direction: "rtl"

highlighter: none

collections:
  news:
    output: true
    permalink: /news/:title/

# Pagination settings
paginate: 5
paginate_path: "/articles/page/:num/"

plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-sitemap
    - faraday-retry
    - jekyll-paginate
    - jekyll-archives

# Jekyll Archives configuration
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category_archive
    tag: tag_archive
  permalinks:
    tag: '/articles/tag/:name/'
    category: '/articles/category/:name/'

exclude:
    - "*.config.js"
    - "package*.json"
    - assets
    - _data/manifest.json
    - node_modules
    - CNAME
    - "Gemfile*"
    - ".idea"
    - _categories/README.md
    - _tags/README.md

# Default Front Matter
defaults:
    -   scope:
            path: ""
            type: "pages"
        values:
            layout: "default"
            title:
            description:
            lang: "ar"
            direction: "rtl"
