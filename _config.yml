url: https://fardane.com

title: "الدكتور فردان"
tagline: "باحث في تاريخ المياه - جامعة القاضي عياض، مراكش"
description: >-
    موقع الدكتور فردان المتخصص في تاريخ المياه والدراسات التاريخية 
        في المغرب وشمال أفريقيا. أستاذ بجامعة القاضي عياض في مراكش.

timezone: "Africa/Casablanca"
lang: "ar"
direction: "rtl"

highlighter: none

plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-sitemap
    - faraday-retry
    - jekyll-paginate

# Collections for tags and categories
collections:
  tags:
    output: true
    permalink: /articles/tag/:name/
  categories:
    output: true
    permalink: /articles/category/:name/

exclude:
    - "*.config.js"
    - "package*.json"
    - assets
    - _data/manifest.json
    - node_modules
    - CNAME
    - "Gemfile*"
    - ".idea"
    - _categories/README.md
    - _tags/README.md

# Default Front Matter
defaults:
    -   scope:
            path: ""
            type: "pages"
        values:
            layout: "default"
            title:
            description:
            lang: "ar"
            direction: "rtl"
