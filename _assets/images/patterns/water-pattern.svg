<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="water-pattern" patternUnits="userSpaceOnUse" width="200" height="200">
      <!-- Background -->
      <rect width="200" height="200" fill="none"/>
      
      <!-- Water wave layers with varying opacity and curves -->
      <g fill="none" stroke="#ffffff" opacity="0.35">
        <!-- Layer 1 - Basic waves -->
        <g stroke-width="0.6">
          <path d="M0,80 C20,70 40,90 60,80 C80,70 100,90 120,80 C140,70 160,90 180,80 C200,70 220,90 240,80" />
          <path d="M0,110 C20,100 40,120 60,110 C80,100 100,120 120,110 C140,100 160,120 180,110 C200,100 220,120 240,110" />
          <path d="M0,140 C20,130 40,150 60,140 C80,130 100,150 120,140 C140,130 160,150 180,140 C200,130 220,150 240,140" />
          <path d="M0,50 C20,40 40,60 60,50 C80,40 100,60 120,50 C140,40 160,60 180,50 C200,40 220,60 240,50" />
        </g>
        
        <!-- Layer 2 - Smaller ripples -->
        <g stroke-width="0.4" opacity="0.6">
          <path d="M0,95 C10,92 20,98 30,95 C40,92 50,98 60,95 C70,92 80,98 90,95 C100,92 110,98 120,95 C130,92 140,98 150,95 C160,92 170,98 180,95 C190,92 200,98 210,95" />
          <path d="M0,125 C10,122 20,128 30,125 C40,122 50,128 60,125 C70,122 80,128 90,125 C100,122 110,128 120,125 C130,122 140,128 150,125 C160,122 170,128 180,125 C190,122 200,128 210,125" />
          <path d="M0,65 C10,62 20,68 30,65 C40,62 50,68 60,65 C70,62 80,68 90,65 C100,62 110,68 120,65 C130,62 140,68 150,65 C160,62 170,68 180,65 C190,62 200,68 210,65" />
        </g>
        
        <!-- Layer 3 - Subtle details -->
        <g stroke-width="0.3" opacity="0.4">
          <path d="M0,102 C5,101 10,103 15,102 C20,101 25,103 30,102 C35,101 40,103 45,102 C50,101 55,103 60,102 C65,101 70,103 75,102 C80,101 85,103 90,102 C95,101 100,103 105,102 C110,101 115,103 120,102 C125,101 130,103 135,102 C140,101 145,103 150,102 C155,101 160,103 165,102 C170,101 175,103 180,102 C185,101 190,103 195,102 C200,101 205,103 210,102" />
          <path d="M0,132 C5,131 10,133 15,132 C20,131 25,133 30,132 C35,131 40,133 45,132 C50,131 55,133 60,132 C65,131 70,133 75,132 C80,131 85,133 90,132 C95,131 100,133 105,132 C110,131 115,133 120,132 C125,131 130,133 135,132 C140,131 145,133 150,132 C155,131 160,133 165,132 C170,131 175,133 180,132 C185,131 190,133 195,132 C200,131 205,133 210,132" />
          <path d="M0,72 C5,71 10,73 15,72 C20,71 25,73 30,72 C35,71 40,73 45,72 C50,71 55,73 60,72 C65,71 70,73 75,72 C80,71 85,73 90,72 C95,71 100,73 105,72 C110,71 115,73 120,72 C125,71 130,73 135,72 C140,71 145,73 150,72 C155,71 160,73 165,72 C170,71 175,73 180,72 C185,71 190,73 195,72 C200,71 205,73 210,72" />
        </g>
      </g>
      
      <!-- Water drop elements -->
      <g fill="#ffffff" opacity="0.25">
        <!-- Scattered water drops of different sizes -->
        <circle cx="25" cy="85" r="1.2" />
        <circle cx="75" cy="115" r="0.8" />
        <circle cx="125" cy="75" r="1.0" />
        <circle cx="175" cy="105" r="0.9" />
        <circle cx="40" cy="145" r="1.1" />
        <circle cx="90" cy="55" r="0.7" />
        <circle cx="140" cy="135" r="1.3" />
        <circle cx="160" cy="65" r="0.6" />
        <circle cx="10" cy="125" r="0.8" />
        <circle cx="60" cy="95" r="1.0" />
        <circle cx="110" cy="155" r="0.9" />
        <circle cx="150" cy="45" r="0.7" />
        <circle cx="190" cy="115" r="1.2" />
      </g>
      
      <!-- Flow lines - subtle currents -->
      <g stroke="#ffffff" stroke-width="0.2" opacity="0.2" fill="none">
        <path d="M20,60 C40,70 60,55 80,65 C100,75 120,60 140,70 C160,80 180,65 200,75" />
        <path d="M0,100 C20,110 40,95 60,105 C80,115 100,100 120,110 C140,120 160,105 180,115" />
        <path d="M10,140 C30,150 50,135 70,145 C90,155 110,140 130,150 C150,160 170,145 190,155" />
      </g>
      
      <!-- Subtle cross-currents -->
      <g stroke="#ffffff" stroke-width="0.2" opacity="0.15" fill="none">
        <path d="M40,0 C30,40 50,80 40,120 C30,160 50,200 40,240" />
        <path d="M100,0 C90,40 110,80 100,120 C90,160 110,200 100,240" />
        <path d="M160,0 C150,40 170,80 160,120 C150,160 170,200 160,240" />
      </g>
    </pattern>
  </defs>
  
  <!-- Apply the pattern to fill the SVG -->
  <rect width="200" height="200" fill="url(#water-pattern)"/>
</svg>
