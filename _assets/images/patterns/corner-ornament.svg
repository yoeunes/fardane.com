<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#D97706" stroke-width="0.8" opacity="0.6">
    <!-- Outer corner frame -->
    <path d="M0,30 C0,10 10,0 30,0 L30,5 C15,5 5,15 5,30 Z" />
    <path d="M0,40 C0,15 15,0 40,0 L40,5 C20,5 5,20 5,40 Z" />
    <path d="M0,50 C0,20 20,0 50,0 L50,5 C25,5 5,25 5,50 Z" />

    <!-- Inner corner decorative elements -->
    <g opacity="0.8">
      <!-- Small triangular elements -->
      <path d="M15,0 L20,5 L25,0" />
      <path d="M35,0 L40,5 L45,0" />
      <path d="M0,15 L5,20 L0,25" />
      <path d="M0,35 L5,40 L0,45" />

      <!-- Curved lines -->
      <path d="M5,5 Q10,10 15,15" />
      <path d="M15,15 Q20,20 25,25" />

      <!-- Middle ornamental pattern -->
      <circle cx="25" cy="25" r="5" stroke-width="0.5" />
      <circle cx="25" cy="25" r="8" stroke-width="0.3" />

      <!-- Decorative flourishes -->
      <path d="M25,25 Q30,20 35,25 Q40,30 35,35 Q30,40 25,35 Q20,30 25,25" />

      <!-- Connecting lines -->
      <path d="M25,5 L25,25" stroke-dasharray="1,1" />
      <path d="M5,25 L25,25" stroke-dasharray="1,1" />
    </g>

    <!-- Additional ornamental elements -->
    <g opacity="0.4">
      <path d="M0,60 L5,60" />
      <path d="M0,70 L10,70" />
      <path d="M0,80 L15,80" />
      <path d="M60,0 L60,5" />
      <path d="M70,0 L70,10" />
      <path d="M80,0 L80,15" />
    </g>
  </g>
</svg>
