<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>إدارة المحتوى | د. عزيز فردان</title>

  <!-- Google Fonts: same as the main site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Base ──────────────────────────────────────────────── */
    body {
      font-family: 'Noto Kufi Arabic', sans-serif;
    }

    /* ── Top bar branding ─────────────────────────────────── */
    [class*="AppHeader"] header,
    header[class*="css"] {
      background: linear-gradient(135deg, #451a03, #78350f) !important;
    }

    /* ── Accent colour → amber ────────────────────────────── */
    a { color: #92400e; }
    a:hover { color: #b45309; }

    /* CMS primary buttons */
    button[class*="PublishButton"],
    button[class*="ToolbarButton"],
    [class*="css-"][role="button"] {
      font-family: 'Noto Kufi Arabic', sans-serif;
    }

    /* ── RTL fixes ────────────────────────────────────────── */
    /* Editor & preview panes */
    [class*="ControlPaneContainer"],
    [class*="PreviewPaneContainer"],
    [class*="EditorControlPane"],
    [data-slate-editor="true"] {
      direction: rtl;
      text-align: right;
    }

    /* Markdown editor body text */
    [data-slate-editor="true"] p,
    [data-slate-editor="true"] li,
    [data-slate-editor="true"] h1,
    [data-slate-editor="true"] h2,
    [data-slate-editor="true"] h3,
    [data-slate-editor="true"] h4,
    [data-slate-editor="true"] blockquote {
      direction: rtl;
      text-align: right;
      font-family: 'Noto Kufi Arabic', sans-serif;
      line-height: 2;
    }

    /* List items */
    [class*="ListControl"] li,
    [class*="ObjectControl"] {
      direction: rtl;
      text-align: right;
    }

    /* Field labels & hints */
    label, [class*="FieldLabel"] {
      font-family: 'Noto Kufi Arabic', sans-serif !important;
      font-weight: 600;
    }
    [class*="hint"], [class*="Hint"] {
      font-family: 'Noto Kufi Arabic', sans-serif !important;
      direction: rtl;
    }

    /* ── Collection list readability ──────────────────────── */
    [class*="ListCard"],
    [class*="ListCardLink"] {
      direction: rtl;
      text-align: right;
      font-family: 'Noto Kufi Arabic', sans-serif;
    }

    /* ── Nicer scrollbar ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb {
      background: #d6a86c;
      border-radius: 3px;
    }

    /* ── Login page polish ────────────────────────────────── */
    [class*="LoginButton"] {
      background: linear-gradient(135deg, #92400e, #b45309) !important;
      font-family: 'Noto Kufi Arabic', sans-serif !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ── Custom preview styles (Arabic, RTL, amber theme) ────
    const previewStyle = `
      body {
        font-family: 'Noto Kufi Arabic', sans-serif;
        direction: rtl;
        text-align: right;
        padding: 24px 32px;
        line-height: 2.1;
        color: #1c1917;
        max-width: 780px;
        margin: 0 auto;
      }
      h1, h2, h3, h4 {
        color: #78350f;
        border-bottom: 2px solid #fbbf2440;
        padding-bottom: 8px;
        margin-top: 1.5em;
      }
      h1 { font-size: 2em; }
      blockquote {
        border-right: 4px solid #f59e0b;
        border-left: none;
        padding: 12px 20px 12px 0;
        background: #fefce8;
        border-radius: 6px;
        margin: 1em 0;
      }
      img {
        max-width: 100%;
        border-radius: 12px;
        margin: 16px 0;
      }
      a { color: #92400e; }
      ul, ol { padding-right: 1.5em; padding-left: 0; }
    `;

    CMS.registerPreviewStyle(previewStyle, { raw: true });
  </script>
</body>
</html>
