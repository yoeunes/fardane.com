<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>إدارة المحتوى | د. عزيز فردان</title>

  <!-- Google Fonts: same as the main site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════════════════════
       Academic Theme - matching main site palette
       Sand:   #fcf9f1 (light) → #d8994d (medium) → #3a1f16 (dark)
       Amber:  #fff8eb (light) → #fa8300 (accent) → #461500 (dark)
       Paper:  #ffffff → #dcd8cc (aged) → #6c6859
       ══════════════════════════════════════════════════════════════ */

    /* ── Base ──────────────────────────────────────────────── */
    body {
      font-family: 'Noto Kufi Arabic', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fcf9f1 0%, #f5efe3 100%);
    }

    /* Main CMS container */
    #nc-root {
      background: transparent;
    }

    /* ── Header - dark academic gradient ─────────────────── */
    [class*="AppHeader"],
    header[class*="css"] {
      background: linear-gradient(135deg, #3a1f16, #5c3a2a, #78350f) !important;
      border-bottom: 3px solid #d8994d !important;
    }

    /* ── Sidebar - warm sand tones ───────────────────────── */
    aside[class*="SidebarContainer"],
    [class*="SidebarContainer"] {
      background: linear-gradient(180deg, #faf6ee 0%, #f0e8d8 100%) !important;
      border-left: 3px solid #d8994d !important;
      box-shadow: -4px 0 20px rgba(58, 31, 22, 0.12) !important;
      position: relative !important;
      flex-shrink: 0;
      width: 240px;
      min-width: 240px;
    }

    /* Sidebar heading */
    aside h2,
    [class*="SidebarHeading"] {
      color: #3a1f16 !important;
      font-weight: 700 !important;
      padding: 16px 20px 8px !important;
      border-bottom: 2px solid #e8d5b5 !important;
      margin-bottom: 12px !important;
    }

    /* Sidebar search */
    aside input[type="search"],
    aside [class*="SearchInput"] {
      margin: 8px 12px !important;
      width: calc(100% - 24px) !important;
    }

    /* Sidebar nav list */
    aside ul,
    [class*="SidebarNavList"] {
      padding: 8px 12px !important;
    }

    /* Sidebar links */
    aside a[class*="SidebarNavLink"],
    [class*="SidebarNavLink"],
    [class*="SidebarLink"] {
      color: #5c3a2a !important;
      border-radius: 8px !important;
      padding: 10px 16px !important;
      margin: 4px 0 !important;
      display: block !important;
      transition: all 0.2s ease !important;
      text-decoration: none !important;
    }

    aside a[class*="SidebarNavLink"]:hover,
    [class*="SidebarNavLink"]:hover,
    [class*="SidebarLink"]:hover {
      background: rgba(216, 153, 77, 0.2) !important;
      color: #78350f !important;
      transform: translateX(-2px);
    }

    /* Active sidebar item */
    aside a[class*="sidebarNavLinkActive"],
    [class*="SidebarNavLink"][class*="active"],
    [class*="SidebarLink"][aria-current="page"] {
      background: linear-gradient(90deg, rgba(216, 153, 77, 0.25), rgba(216, 153, 77, 0.05)) !important;
      border-right: 4px solid #d8994d !important;
      color: #78350f !important;
      font-weight: 700 !important;
    }

    /* ── Accent colour → amber ────────────────────────────── */
    a { color: #92400e; }
    a:hover { color: #b45309; }

    /* ── Buttons - amber gradient ────────────────────────── */
    button[class*="Button"],
    button[class*="PublishButton"],
    button[class*="ToolbarButton"],
    [class*="css-"][role="button"] {
      font-family: 'Noto Kufi Arabic', sans-serif;
      background: linear-gradient(135deg, #b45309, #d97706) !important;
      border: none !important;
      border-radius: 8px !important;
      color: white !important;
      font-weight: 600 !important;
      transition: all 0.2s ease !important;
    }

    button[class*="Button"]:hover,
    button[class*="ToolbarButton"]:hover {
      background: linear-gradient(135deg, #92400e, #b45309) !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.3) !important;
    }

    /* Secondary/outline buttons */
    button[class*="secondary"],
    button[class*="Secondary"] {
      background: transparent !important;
      border: 2px solid #d8994d !important;
      color: #78350f !important;
    }

    button[class*="secondary"]:hover,
    button[class*="Secondary"]:hover {
      background: #fef3c7 !important;
    }

    /* ── Entry list container ────────────────────────────── */
    main ul[class*="css"] {
      padding: 0 20px 20px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 12px !important;
    }

    /* ── Entry cards - paper style ───────────────────────── */
    main ul li,
    [class*="ListCard"],
    [class*="EntryCard"] {
      background: #fffdf9 !important;
      border: 1px solid #e8d5b5 !important;
      border-radius: 12px !important;
      box-shadow: 0 2px 8px rgba(58, 31, 22, 0.06) !important;
      transition: all 0.25s ease !important;
      margin: 0 !important;
      overflow: hidden !important;
    }

    main ul li:hover,
    [class*="ListCard"]:hover,
    [class*="EntryCard"]:hover {
      transform: translateY(-3px) !important;
      box-shadow: 0 8px 25px rgba(58, 31, 22, 0.12) !important;
      border-color: #d8994d !important;
      background: #fffff8 !important;
    }

    /* Entry card links */
    main ul li a,
    [class*="ListCard"] a,
    [class*="ListCardLink"] {
      direction: rtl;
      text-align: right;
      font-family: 'Noto Kufi Arabic', sans-serif;
      padding: 16px 20px !important;
      display: block !important;
      text-decoration: none !important;
    }

    /* Entry card headings */
    main ul li h2,
    [class*="ListCard"] h2,
    [class*="ListCardTitle"] {
      color: #3a1f16 !important;
      font-size: 1rem !important;
      font-weight: 600 !important;
      line-height: 1.8 !important;
      margin: 0 !important;
      border: none !important;
      border-bottom: none !important;
      padding-bottom: 0 !important;
    }

    main ul li:hover h2 {
      color: #78350f !important;
    }

    /* ── Editor area - clean paper ───────────────────────── */
    [class*="EditorContainer"],
    [class*="ControlPaneContainer"] {
      background: #fffdf9 !important;
    }

    /* ── Input fields ────────────────────────────────────── */
    input[type="text"],
    input[type="search"],
    textarea,
    [class*="TextField"] input {
      background: #fffdf9 !important;
      border: 1px solid #e8d5b5 !important;
      border-radius: 8px !important;
      padding: 12px 16px !important;
      font-family: 'Noto Kufi Arabic', sans-serif !important;
      transition: all 0.2s ease !important;
    }

    input:focus,
    textarea:focus {
      border-color: #d8994d !important;
      box-shadow: 0 0 0 3px rgba(216, 153, 77, 0.2) !important;
      outline: none !important;
    }

    /* ── Collection header ───────────────────────────────── */
    [class*="CollectionTop"],
    [class*="CollectionTopContainer"] {
      background: linear-gradient(180deg, #faf6ee 0%, #fcf9f1 100%) !important;
      border-bottom: 2px solid #e8d5b5 !important;
      padding: 24px !important;
      margin-bottom: 8px !important;
    }

    /* Collection title */
    [class*="CollectionTop"] h1,
    main > div:first-child h1 {
      color: #3a1f16 !important;
      font-size: 1.5rem !important;
      font-weight: 700 !important;
      margin-bottom: 8px !important;
    }

    /* Collection description */
    [class*="CollectionTop"] p,
    main > div:first-child > p {
      color: #6c6859 !important;
      font-size: 0.95rem !important;
    }

    /* New entry button in collection header */
    [class*="CollectionTop"] a[href*="new"],
    main > div:first-child a[href*="new"] {
      background: linear-gradient(135deg, #78350f, #92400e) !important;
      color: white !important;
      padding: 10px 20px !important;
      border-radius: 8px !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      transition: all 0.2s ease !important;
      box-shadow: 0 2px 8px rgba(120, 53, 15, 0.2) !important;
    }

    [class*="CollectionTop"] a[href*="new"]:hover,
    main > div:first-child a[href*="new"]:hover {
      background: linear-gradient(135deg, #92400e, #b45309) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 15px rgba(120, 53, 15, 0.3) !important;
    }

    /* ── Media library ───────────────────────────────────── */
    [class*="MediaLibrary"] {
      background: #faf6ee !important;
    }

    /* ── RTL fixes ────────────────────────────────────────── */
    /* Editor & preview panes */
    [class*="ControlPaneContainer"],
    [class*="PreviewPaneContainer"],
    [class*="EditorControlPane"],
    [data-slate-editor="true"] {
      direction: rtl;
      text-align: right;
    }

    /* Markdown editor body text */
    [data-slate-editor="true"] p,
    [data-slate-editor="true"] li,
    [data-slate-editor="true"] h1,
    [data-slate-editor="true"] h2,
    [data-slate-editor="true"] h3,
    [data-slate-editor="true"] h4,
    [data-slate-editor="true"] blockquote {
      direction: rtl;
      text-align: right;
      font-family: 'Noto Kufi Arabic', sans-serif;
      line-height: 2;
    }

    /* List items */
    [class*="ListControl"] li,
    [class*="ObjectControl"] {
      direction: rtl;
      text-align: right;
    }

    /* Field labels & hints */
    label, [class*="FieldLabel"] {
      font-family: 'Noto Kufi Arabic', sans-serif !important;
      font-weight: 600;
    }
    [class*="hint"], [class*="Hint"] {
      font-family: 'Noto Kufi Arabic', sans-serif !important;
      direction: rtl;
    }

    /* ── Sidebar RTL positioning fix ─────────────────────────── */
    /* Main app container - ensure proper flex direction for RTL */
    [class*="AppMainContainer"],
    [class*="CollectionContainer"] {
      flex-direction: row-reverse !important;
    }

    /* Main content area - ensure it doesn't overlap sidebar */
    [class*="CollectionMain"],
    [class*="EntriesContainer"] {
      flex: 1;
      min-width: 0;
      margin-right: 0 !important;
      margin-left: 0 !important;
    }

    /* ── Scrollbar - golden accent ───────────────────────── */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f5efe3;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #d8994d, #c4873f);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #c4873f, #b07835);
    }

    /* ── Login page polish ────────────────────────────────── */
    [class*="LoginButton"] {
      background: linear-gradient(135deg, #92400e, #b45309) !important;
      font-family: 'Noto Kufi Arabic', sans-serif !important;
    }

    /* ── Force list view: disable grid button ─────────────── */
    [class*="ViewStyleControl"] button:last-child,
    button[title*="Grid" i],
    button[aria-label*="Grid" i] {
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── Toast notifications ─────────────────────────────── */
    [class*="Toast"],
    [data-testid*="toast"],
    .nc-toast,
    [role="alert"][class*="notification"] {
      background: #fffdf9 !important;
      border: 1px solid #d8994d !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 30px rgba(58, 31, 22, 0.15) !important;
      font-family: 'Noto Kufi Arabic', sans-serif !important;
      direction: rtl !important;
      text-align: right !important;
    }

    [class*="Toast"] [class*="ToastContent"],
    [data-testid*="toast"] [class*="content"],
    .nc-toast [class*="content"] {
      direction: rtl !important;
      text-align: right !important;
      font-family: 'Noto Kufi Arabic', sans-serif !important;
    }

    /* ── Modal dialogs ───────────────────────────────────── */
    [class*="Modal"],
    [class*="Dialog"] {
      background: #fffdf9 !important;
      border-radius: 16px !important;
      box-shadow: 0 20px 60px rgba(58, 31, 22, 0.2) !important;
    }

    /* ── Loading states ──────────────────────────────────── */
    [class*="Loading"] {
      color: #d8994d !important;
    }

    /* ── Dashboard Styles ─────────────────────────────────── */
    #dashboard-wrapper {
      min-height: 100vh;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .dashboard-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .dashboard-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .dashboard-header h1 {
      color: #78350f;
      font-size: 2rem;
      margin: 0 0 10px 0;
    }

    .dashboard-header p {
      color: #92400e;
      font-size: 1.1rem;
      margin: 0;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(120, 53, 15, 0.1);
      border: 1px solid #fde68a;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(120, 53, 15, 0.15);
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #78350f;
      display: block;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 1rem;
      color: #92400e;
    }

    /* Quick Actions */
    .quick-actions {
      margin-bottom: 40px;
    }

    .quick-actions h2 {
      color: #78350f;
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 24px;
      background: linear-gradient(135deg, #92400e, #b45309);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(146, 64, 14, 0.3);
      color: white;
    }

    .action-btn.secondary {
      background: white;
      color: #78350f;
      border: 2px solid #fbbf24;
    }

    .action-btn.secondary:hover {
      background: #fef3c7;
    }

    .action-icon {
      font-size: 1.3rem;
    }

    /* Enter CMS Section */
    .enter-cms {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(120, 53, 15, 0.1);
      border: 1px solid #fde68a;
    }

    .enter-cms p {
      color: #92400e;
      margin-bottom: 20px;
    }

    .cms-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      background: linear-gradient(135deg, #451a03, #78350f);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cms-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(69, 26, 3, 0.3);
    }

    /* Loading state */
    .loading {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- Dashboard Wrapper -->
  <div id="dashboard-wrapper" style="display: none;">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h1>لوحة إدارة المحتوى</h1>
        <p>مرحباً بك في نظام إدارة موقع د. عزيز فردان</p>
      </div>

      <!-- Statistics -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number loading" id="posts-count">--</span>
          <span class="stat-label">المقالات</span>
        </div>
        <div class="stat-card">
          <span class="stat-number loading" id="news-count">--</span>
          <span class="stat-label">الأخبار</span>
        </div>
        <div class="stat-card">
          <span class="stat-number loading" id="pages-count">--</span>
          <span class="stat-label">الصفحات</span>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <h2>إجراءات سريعة</h2>
        <div class="actions-grid">
          <a href="/admin/#/collections/posts/new" class="action-btn">
            <span class="action-icon">📝</span>
            إضافة مقال جديد
          </a>
          <a href="/admin/#/collections/news/new" class="action-btn">
            <span class="action-icon">📰</span>
            إضافة خبر جديد
          </a>
          <a href="/admin/#/collections/posts" class="action-btn secondary">
            <span class="action-icon">📚</span>
            عرض كل المقالات
          </a>
          <a href="/admin/#/collections/news" class="action-btn secondary">
            <span class="action-icon">🗞️</span>
            عرض كل الأخبار
          </a>
        </div>
      </div>

      <!-- Enter CMS -->
      <div class="enter-cms">
        <p>للوصول إلى جميع خيارات إدارة المحتوى</p>
        <button class="cms-btn" onclick="showCMS()">
          <span>⚙️</span>
          الدخول لإدارة المحتوى الكاملة
        </button>
      </div>
    </div>
  </div>

  <!-- CMS Mount Point -->
  <div id="nc-root"></div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ── Force list view ──────────────────────────────────────
    localStorage.setItem('netlify-cms.view-style', 'LIST');

    // ── Arabic Locale ────────────────────────────────────────
    const ar = {
      auth: {
        login: 'تسجيل الدخول',

        }
      },

          loadingConfig: 'جارٍ تحميل الإعدادات...',
          waitingBackend: 'في انتظار الخادم...'
        },
        notFoundPage: {

        }
      },
      collection: {
        sidebar: {

        collectionTop: {

        defaultFields: {

            label: 'الكاتب'
          },
          updatedOn: {
            label: 'تاريخ التحديث'
          }
        },
        notFound: 'المجموعة غير موجودة'
      },
      editor: {
        editorControl: {
          field: {
            optional: 'اختياري'
          }
        },
        editorControlPane: {
          widget: {
            required: '%{fieldLabel} مطلوب',
            regexPattern: '%{fieldLabel} لا يطابق النمط: %{pattern}',
            processing: 'جارٍ معالجة %{fieldLabel}',

      body {
        font-family: 'Noto Kufi Arabic', sans-serif;

        padding: 24px 32px;

        padding: 12px 20px 12px 0;

        max-width: 100%;

        margin: 16px 0;
      }
      a { color: #92400e; }
      ul, ol { padding-right: 1.5em; padding-left: 0; }
    `;

    CMS.registerPreviewStyle(previewStyle, { raw: true });

    // ── Dashboard Logic ──────────────────────────────────────
    const dashboardWrapper = document.getElementById('dashboard-wrapper');
    const cmsRoot = document.getElementById('nc-root');

    function showDashboard() {
      dashboardWrapper.style.display = 'block';
      cmsRoot.style.display = 'none';
      loadStats();
    }

    function showCMS() {
      dashboardWrapper.style.display = 'none';
      cmsRoot.style.display = 'block';
      // Navigate to collections if not already there
      if (!window.location.hash || window.location.hash === '#/') {
        window.location.hash = '#/collections/posts';
      }
    }

    async function loadStats() {
      const owner = 'yoeunes';
      const repo = 'fardane.com';
      const branch = 'main';

      try {
        // Fetch posts count
        const postsResponse = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/contents/src/content/posts?ref=${branch}`
        );
        if (postsResponse.ok) {
          const posts = await postsResponse.json();
          const postsCount = posts.filter(f => f.name.endsWith('.md')).length;
          document.getElementById('posts-count').textContent = postsCount;
          document.getElementById('posts-count').classList.remove('loading');
        }
      } catch (e) {
        document.getElementById('posts-count').textContent = '?';
        document.getElementById('posts-count').classList.remove('loading');
      }

      try {
        // Fetch news count
        const newsResponse = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/contents/src/content/news?ref=${branch}`
        );
        if (newsResponse.ok) {
          const news = await newsResponse.json();
          const newsCount = news.filter(f => f.name.endsWith('.md')).length;
          document.getElementById('news-count').textContent = newsCount;
          document.getElementById('news-count').classList.remove('loading');
        }
      } catch (e) {
        document.getElementById('news-count').textContent = '?';
        document.getElementById('news-count').classList.remove('loading');
      }

      try {
        // Fetch pages count
        const pagesResponse = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/contents/src/content/pages?ref=${branch}`
        );
        if (pagesResponse.ok) {
          const pages = await pagesResponse.json();
          const pagesCount = pages.filter(f => f.name.endsWith('.md')).length;
          document.getElementById('pages-count').textContent = pagesCount;
          document.getElementById('pages-count').classList.remove('loading');
        }
      } catch (e) {
        document.getElementById('pages-count').textContent = '?';
        document.getElementById('pages-count').classList.remove('loading');
      }
    }

    // ── Initialization ───────────────────────────────────────
    // Check if URL has a hash (CMS route) - if so, show CMS directly
    if (window.location.hash && window.location.hash !== '#/') {
      showCMS();
    } else {
      showDashboard();
    }

    // Listen for hash changes
    window.addEventListener('hashchange', function() {
      if (!window.location.hash || window.location.hash === '#/') {
        showDashboard();
      } else {
        dashboardWrapper.style.display = 'none';
        cmsRoot.style.display = 'block';
      }
    });
  </script>
