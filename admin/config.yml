backend:
  name: github
  repo: yoeunes/fardane.com
  branch: main
  base_url: https://fardane.com
  auth_endpoint: /api/auth

locale: 'ar'
site_url: https://fardane.com
display_url: https://fardane.com
logo_url: https://fardane.com/dist/images/university-logo.png

# ── Media ──────────────────────────────────────────────────
media_folder: "_assets/images"
public_folder: "/dist/images"

slug:
  encoding: "unicode"
  clean_accents: false

# ══════════════════════════════════════════════════════════════
# Collections
# ══════════════════════════════════════════════════════════════
collections:

  # ── المقالات (Articles) ──────────────────────────────────
  - name: "posts"
    label: "المقالات"
    label_singular: "مقال"
    description: "المقالات والأبحاث الأكاديمية للدكتور عزيز فردان"
    folder: "_posts"
    extension: "html"
    format: "frontmatter"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['date', 'title']
    summary: "{{title}}  ·  {{date | date('YYYY-MM-DD')}}"
    # Default values for new articles
    view_filters:
      - label: "مقالات مميزة"
        field: featured
        pattern: true
    view_groups:
      - label: "السنة"
        field: date
        pattern: '\d{4}'
    fields:
      # ─ hidden ─
      - label: "التخطيط"
        name: "layout"
        widget: "hidden"
        default: "post"

      # ─ core info ─
      - label: "العنوان"
        name: "title"
        widget: "string"
        hint: "عنوان المقال الرئيسي"

      - label: "تاريخ النشر"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "يُحدد تلقائياً بتاريخ اليوم"

      - label: "الوصف المختصر"
        name: "description"
        widget: "text"
        hint: "يظهر في نتائج البحث وبطاقات المقالات (2-3 أسطر)"

      # ─ taxonomy ─
      - label: "الفئة"
        name: "categories"
        widget: "list"
        hint: "اختر فئة واحدة أو أكثر"
        field:
          label: "فئة"
          name: "category"
          widget: "select"
          options:
            - "تاريخ-الماء"
            - "هندسة-هيدروليكية"
            - "جغرافيا-تاريخية"
            - "تاريخ-العمران"
            - "التاريخ-الاقتصادي"
            - "الحرف-التقليدية"
            - "التاريخ-الحضري"
            - "الأنثروبولوجيا-التاريخية"
            - "الدراسات-الدينية"
            - "التاريخ-الثقافي"
            - "التاريخ-البيئي"
            - "العلاقات-الإنسانية-البيئية"
            - "التراث-الثقافي"
            - "الاقتصاد-التقليدي"
            - "دراسات-فكرية"
            - "فلسفة-التاريخ"
            - "فعاليات أكاديمية"
            - "تاريخ جهوي"

      - label: "الكلمات المفتاحية"
        name: "tags"
        widget: "list"
        hint: "أدخل الوسوم مفصولة بفاصلة"

      # ─ media (optional) ─
      - label: "صورة المقال"
        name: "image"
        widget: "image"
        required: false
        hint: "اختياري — صورة رئيسية تظهر في أعلى المقال"
        default: "/dist/images/articles/default.jpg"

      - label: "صورة مصغرة"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "اختياري — تُستخدم في بطاقات المقالات. إن تُركت فارغة تُستخدم صورة المقال"
        default: "/dist/images/articles/default.jpg"

      # ─ settings ─
      - label: "مقال مميز"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "يظهر في قسم «المميزات» على الصفحة الرئيسية"

      - label: "وقت القراءة (دقيقة)"
        name: "reading_time"
        widget: "number"
        default: 10
        value_type: "int"
        min: 1
        max: 120

      # ─ body ─
      - label: "محتوى المقال"
        name: "body"
        widget: "markdown"
        hint: "اكتب المحتوى بالعربية. يمكنك إضافة عناوين وصور واقتباسات."

  # ── الأخبار (News) ──────────────────────────────────────
  - name: "news"
    label: "الأخبار"
    label_singular: "خبر"
    description: "المؤتمرات والمنح والإصدارات والفعاليات الأكاديمية"
    folder: "_news"
    extension: "html"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    sortable_fields: ['date', 'title']
    summary: "{{title}}  ·  {{date | date('YYYY-MM-DD')}}"
    view_groups:
      - label: "النوع"
        field: type
    fields:
      # ─ hidden ─
      - label: "التخطيط"
        name: "layout"
        widget: "hidden"
        default: "news-article"

      # ─ core info ─
      - label: "العنوان"
        name: "title"
        widget: "string"

      - label: "تاريخ النشر"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "يُحدد تلقائياً بتاريخ اليوم"

      - label: "الوصف"
        name: "description"
        widget: "text"
        hint: "وصف مختصر للخبر (2-3 أسطر)"

      - label: "نوع الخبر"
        name: "type"
        widget: "select"
        options:
          - label: "مؤتمرات"
            value: "مؤتمرات"
          - label: "ندوات"
            value: "ندوات"
          - label: "دعوة للمشاركة"
            value: "دعوة للمشاركة"
          - label: "وظائف"
            value: "وظائف"
          - label: "منحة"
            value: "منحة"
          - label: "منح"
            value: "منح"
          - label: "إصدارات"
            value: "إصدارات"
        hint: "يُستخدم لتصنيف وتصفية الأخبار"

      # ─ media (optional) ─
      - label: "صورة مصغرة"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "اختياري — صورة تظهر مع الخبر"
        default: "/dist/images/news/default.jpg"

      # ─ link ─
      - label: "رابط خارجي"
        name: "external_url"
        widget: "string"
        required: false
        hint: "رابط اختياري للموقع الأصلي أو التسجيل"

      # ─ body ─
      - label: "المحتوى"
        name: "body"
        widget: "markdown"
        hint: "تفاصيل الخبر. يمكنك إضافة عناوين وقوائم وروابط."
