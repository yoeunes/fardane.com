backend:
  name: github
  repo: yoeunes/fardane.com
  branch: main
  base_url: https://fardane.com
  auth_endpoint: /api/auth

locale: 'ar'
site_url: https://fardane.com
display_url: https://fardane.com
logo_url: https://fardane.com/dist/images/university-logo.png

# ── Media ──────────────────────────────────────────────────
media_folder: "_assets/images"
public_folder: "/dist/images"

slug:
  encoding: "unicode"
  clean_accents: false

# ══════════════════════════════════════════════════════════════
# Collections
# ══════════════════════════════════════════════════════════════
collections:

  # ── المقالات (Articles) ──────────────────────────────────
  - name: "posts"
    label: "المقالات"
    label_singular: "مقال"
    description: "المقالات والأبحاث الأكاديمية للدكتور عزيز فردان"
    folder: "_posts"
    extension: "html"
    format: "frontmatter"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['date', 'title']
    summary: "{{title}}  ·  {{date | date('YYYY-MM-DD')}}"
    # Default values for new articles
    view_filters:
      - label: "مقالات مميزة"
        field: featured
        pattern: true
    view_groups:
      - label: "السنة"
        field: date
        pattern: '\d{4}'
    fields:
      # ─ hidden ─
      - label: "التخطيط"
        name: "layout"
        widget: "hidden"
        default: "post"

      # ─ core info ─
      - label: "العنوان"
        name: "title"
        widget: "string"
        hint: "عنوان المقال الرئيسي"

      - label: "تاريخ النشر"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "يُحدد تلقائياً بتاريخ اليوم"

      - label: "الوصف المختصر"
        name: "description"
        widget: "text"
        hint: "يظهر في نتائج البحث وبطاقات المقالات (2-3 أسطر)"

      # ─ taxonomy ─
      - label: "الفئة"
        name: "categories"
        widget: "list"
        hint: "اختر فئة واحدة أو أكثر"
        field:
          label: "فئة"
          name: "category"
          widget: "select"
          options:
            - "تاريخ-الماء"
            - "هندسة-هيدروليكية"
            - "جغرافيا-تاريخية"
            - "تاريخ-العمران"
            - "التاريخ-الاقتصادي"
            - "الحرف-التقليدية"
            - "التاريخ-الحضري"
            - "الأنثروبولوجيا-التاريخية"
            - "الدراسات-الدينية"
            - "التاريخ-الثقافي"
            - "التاريخ-البيئي"
            - "العلاقات-الإنسانية-البيئية"
            - "التراث-الثقافي"
            - "الاقتصاد-التقليدي"
            - "دراسات-فكرية"
            - "فلسفة-التاريخ"
            - "فعاليات أكاديمية"
            - "تاريخ جهوي"

      - label: "الكلمات المفتاحية"
        name: "tags"
        widget: "list"
        hint: "أدخل الوسوم مفصولة بفاصلة"

      # ─ media (optional) ─
      - label: "صورة المقال"
        name: "image"
        widget: "image"
        required: false
        hint: "اختياري — صورة رئيسية تظهر في أعلى المقال"
        default: "/dist/images/articles/default.jpg"

      - label: "صورة مصغرة"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "اختياري — تُستخدم في بطاقات المقالات. إن تُركت فارغة تُستخدم صورة المقال"
        default: "/dist/images/articles/default.jpg"

      # ─ settings ─
      - label: "مقال مميز"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "يظهر في قسم «المميزات» على الصفحة الرئيسية"

      - label: "وقت القراءة (دقيقة)"
        name: "reading_time"
        widget: "number"
        default: 10
        value_type: "int"
        min: 1
        max: 120

      # ─ body ─
      - label: "محتوى المقال"
        name: "body"
        widget: "markdown"
        hint: "اكتب المحتوى بالعربية. يمكنك إضافة عناوين وصور واقتباسات."

  # ── الأخبار (News) ──────────────────────────────────────
  - name: "news"
    label: "الأخبار"
    label_singular: "خبر"
    description: "المؤتمرات والمنح والإصدارات والفعاليات الأكاديمية"
    folder: "_news"
    extension: "html"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    sortable_fields: ['date', 'title']
    summary: "{{title}}  ·  {{date | date('YYYY-MM-DD')}}"
    view_groups:
      - label: "النوع"
        field: type
    fields:
      # ─ hidden ─
      - label: "التخطيط"
        name: "layout"
        widget: "hidden"
        default: "news-article"

      # ─ core info ─
      - label: "العنوان"
        name: "title"
        widget: "string"

      - label: "تاريخ النشر"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "يُحدد تلقائياً بتاريخ اليوم"

      - label: "الوصف"
        name: "description"
        widget: "text"
        hint: "وصف مختصر للخبر (2-3 أسطر)"

      - label: "نوع الخبر"
        name: "type"
        widget: "select"
        options:
          - label: "مؤتمرات"
            value: "مؤتمرات"
          - label: "ندوات"
            value: "ندوات"
          - label: "دعوة للمشاركة"
            value: "دعوة للمشاركة"
          - label: "وظائف"
            value: "وظائف"
          - label: "منحة"
            value: "منحة"
          - label: "منح"
            value: "منح"
          - label: "إصدارات"
            value: "إصدارات"
        hint: "يُستخدم لتصنيف وتصفية الأخبار"

      # ─ media (optional) ─
      - label: "صورة مصغرة"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "اختياري — صورة تظهر مع الخبر"
        default: "/dist/images/news/default.jpg"

      # ─ link ─
      - label: "رابط خارجي"
        name: "external_url"
        widget: "string"
        required: false
        hint: "رابط اختياري للموقع الأصلي أو التسجيل"

      # ─ body ─
      - label: "المحتوى"
        name: "body"
        widget: "markdown"
        required: false
        hint: "تفاصيل الخبر. يمكنك إضافة عناوين وقوائم وروابط. اتركه فارغاً إذا كان الخبر يحتوي فقط على رابط خارجي."

  # ── العلماء (Scientists) ──────────────────────────────────────
  - name: "scientists"
    label: "العلماء"
    label_singular: "عالم"
    description: "العلماء والشخصيات التاريخية في مجال علوم المياه والهيدرولوجيا"
    folder: "_scientists"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    sortable_fields: ['name', 'category', 'featured']
    summary: "{{name}}  ·  {{category}}"
    view_filters:
      - label: "علماء مميزون"
        field: featured
        pattern: true
    view_groups:
      - label: "التخصص"
        field: category
    fields:
      # ─ hidden ─
      - label: "التخطيط"
        name: "layout"
        widget: "hidden"
        default: "scientist"

      # ─ core info ─
      - label: "الاسم"
        name: "name"
        widget: "string"
        hint: "اسم العالم بالعربية"

      - label: "الفترة الزمنية"
        name: "dates"
        widget: "string"
        hint: "مثال: 1136-1206م (530-603هـ)"

      - label: "مكان الولادة/النشاط"
        name: "location"
        widget: "string"
        required: false
        hint: "مثال: الأندلس، بغداد، مراكش"

      # ─ media ─
      - label: "صورة العالم"
        name: "image"
        widget: "image"
        required: false
        hint: "صورة العالم (اختياري)"
        default: "/dist/images/scientists/default.jpg"

      # ─ taxonomy ─
      - label: "التخصص"
        name: "category"
        widget: "select"
        options:
          - label: "الهندسة المائية"
            value: "engineering"
          - label: "الجغرافيا المائية"
            value: "geography"
          - label: "الطب المائي"
            value: "medicine"
          - label: "الزراعة المائية"
            value: "agriculture"
          - label: "الفلك والمواقيت المائية"
            value: "astronomy"
          - label: "الكيمياء المائية"
            value: "chemistry"
          - label: "الفقه المائي"
            value: "jurisprudence"
        hint: "يُستخدم لتصنيف العلماء"

      - label: "المجالات"
        name: "tags"
        widget: "list"
        hint: "أدخل المجالات التي تخصص فيها العالم"
        field:
          label: "مجال"
          name: "tag"
          widget: "string"

      # ─ settings ─
      - label: "عالم مميز"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "يظهر في قسم «العلماء المميزون» على الصفحة الرئيسية"

      # ─ body ─
      - label: "نبذة عن العالم"
        name: "body"
        widget: "markdown"
        required: false
        sanitize_preview: true
        hint: "اكتب نبذة مختصرة عن العالم وإسهاماته في علوم المياه"
