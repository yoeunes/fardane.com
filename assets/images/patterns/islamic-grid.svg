<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Basic unit of the pattern -->
    <pattern id="unit" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Background grid -->
      <path d="M0,0 L50,0 L50,50 L0,50 Z" fill="none" stroke="#B45309" stroke-width="0.2" opacity="0.2" />

      <!-- Star pattern -->
      <path d="M25,0 L30,20 L50,25 L30,30 L25,50 L20,30 L0,25 L20,20 Z" fill="none" stroke="#B45309" stroke-width="0.5" opacity="0.3" />

      <!-- Inner star -->
      <path d="M25,10 L28,20 L40,25 L28,30 L25,40 L22,30 L10,25 L22,20 Z" fill="none" stroke="#B45309" stroke-width="0.5" opacity="0.3" />

      <!-- Center element -->
      <circle cx="25" cy="25" r="3" fill="none" stroke="#B45309" stroke-width="0.4" opacity="0.4" />

      <!-- Connecting lines -->
      <line x1="0" y1="25" x2="50" y2="25" stroke="#B45309" stroke-width="0.2" opacity="0.2" />
      <line x1="25" y1="0" x2="25" y2="50" stroke="#B45309" stroke-width="0.2" opacity="0.2" />

      <!-- Diagonal lines -->
      <line x1="0" y1="0" x2="50" y2="50" stroke="#B45309" stroke-width="0.2" opacity="0.1" />
      <line x1="50" y1="0" x2="0" y2="50" stroke="#B45309" stroke-width="0.2" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Apply the pattern to fill the entire SVG -->
  <rect width="100" height="100" fill="url(#unit)" />
</svg>
